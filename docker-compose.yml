services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: career-match
    restart: unless-stopped
    ports:
      - "25426:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=your-very-secret-key-change-this
      - JWT_EXPIRES_IN=24h
      - FRONTEND_URL=http://localhost:25426
      - DB_STORAGE=/app/database.sqlite